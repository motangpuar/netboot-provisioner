services:
  worker:
    image: ghcr.io/motangpuar/netboot-provisioner:${TAG:-latest}
    # build: .        # uncomment for local dev
    container_name: netboot-worker
    restart: unless-stopped

    # DHCP/TFTP are L2 — host networking is mandatory.
    # The container shares the host's eth0/br0 directly.
    network_mode: host

    # Raw sockets + bind to privileged ports (<1024) + SO_BINDTODEVICE
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE

    environment:
      # --- General ---
      SECRET_KEY:            ${SECRET_KEY:?SECRET_KEY is required}

      # --- DHCP ---
      DHCP_ENABLE:           "true"
      DHCP_BIND_INTERFACE:   ${DHCP_BIND_INTERFACE:-br0}
      DHCP_BOOT_FILE:        ${DHCP_BOOT_FILE:-bios/pxelinux.0}
      # DHCP_BIND_ADDRESS, DHCP_TFTP_IP, DHCP_NEXT_SERVER_IP
      # are auto-derived from DHCP_BIND_INTERFACE.
      # Override only for multi-homed hosts:
      # DHCP_TFTP_IP:        "192.168.100.1"
      # DHCP_NEXT_SERVER_IP: "192.168.100.1"
      # --- TFTP ---
      TFTP_ENABLE:           "true"
      TFTP_BLOCKSIZE:        "1468"

      TZ: UTC

    volumes:
      # Persist generated boot files across restarts
      - ./assets:/app/assets
      # Persist the machine inventory
      - ./inputs:/app/inputs
      # Uncomment to live-edit templates without rebuilding the image:
      # - ./templates:/app/templates:ro

    # Sensible defaults so a misconfigured run doesn't hang
    stop_grace_period: 10s

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8033/test"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
