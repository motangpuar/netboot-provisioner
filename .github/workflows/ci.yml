name: CI

on:
  pull_request:
    branches: [ci-test, main]
  push:
    branches: [ci-test, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Build binary
        run: make build

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: netboot-provisioner:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test image
        run: |
          docker run --rm --entrypoint /app/worker netboot-provisioner:ci --help || true
          docker image inspect netboot-provisioner:ci >/dev/null
